<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks — Suggest Page</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://suggestpage.com/sell/thanks/">
<script src="/js/sp-theme-boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{background:var(--base-2,#14161c);color:var(--ink,#e8e6e1)}
.e-wrap{max-width:720px;margin:0 auto;padding:clamp(36px,7vw,72px) clamp(20px,5vw,64px)}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent,#c8b48a);margin:0 0 12px}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:clamp(48px,10vw,88px);line-height:.9;margin:0 0 18px}
.lede{font-family:"IBM Plex Mono",monospace;font-size:14px;line-height:1.7;color:var(--ink-soft,#9b9a96);max-width:52ch}
.lede a{color:var(--accent,#c8b48a)}
.actions{margin-top:28px;display:flex;gap:14px;flex-wrap:wrap}
.actions a{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--base-2,#14161c);background:var(--ink,#e8e6e1);border:1px solid var(--ink,#e8e6e1);padding:12px 18px}
.actions a.ghost{background:transparent;color:var(--ink-soft,#9b9a96);border-color:var(--line,#2c303a)}
.actions a:hover{background:var(--accent,#c8b48a);border-color:var(--accent,#c8b48a);color:var(--base-2,#14161c)}
</style>
</head>
<body>
<div class="e-wrap">
  <p class="kicker">Color It Company · Checkout</p>
  <h1>Thanks — you’re in</h1>
  <p class="lede">Payment received. We’ll email <strong>steven@coloritcompany.com</strong> confirmation and start your suggestion page setup. Questions anytime at that same address.</p>
  <div class="actions">
    <a href="/suggest/">See the demo form</a>
    <a class="ghost" href="/">Back to the offer</a>
  </div>
</div>
</body>
</html>
